[project]
name = "safeai-b2b-worker"
version = "0.1.0"
description = "Isolated document worker for B2B Request Agent"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1,<1",
    "openpyxl>=3.1.5,<4",
    "pymupdf>=1.26.5,<3",
    "pydantic>=2.12.0,<3"
]

[project.optional-dependencies]
dev = [
    "mypy>=1.18,<2",
    "pytest>=8.4,<10",
    "ruff>=0.14,<1",
    "types-openpyxl>=3.1.5,<4"
]

[project.scripts]
safeai-b2b-worker = "safeai_worker.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safeai_worker"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["safeai_worker"]

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

